<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130">
<defs>
<linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#155e8c"/>
<stop offset="45%" stop-color="#2fa8d4"/>
<stop offset="100%" stop-color="#7fe3f0"/>
</linearGradient>
<linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="52%" stop-color="#ffffff" stop-opacity="0.22"/>
<stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip">
<polygon points="4,4 36,4 112,124 80,124"/>
<polygon points="80,4 112,4 36,124 4,124"/>
<polygon points="100,4 132,4 132,124 100,124"/>
<polygon points="190,4 222,4 222,124 190,124"/>
<polygon points="100,4 132,4 222,124 190,124"/>
<path d="M 210,4 L 268,4 L 296,30 L 296,98 L 268,124 L 210,124 L 210,96 L 238,96 L 238,32 L 210,32 Z" fill-rule="evenodd"/>
</clipPath>
</defs>

<g>
<!-- X -->
<polygon points="4,4 36,4 112,124 80,124" fill="url(#g)"/>
<polygon points="80,4 112,4 36,124 4,124" fill="url(#g)"/>

<!-- N -->
<polygon points="100,4 132,4 132,124 100,124" fill="url(#g)"/>
<polygon points="190,4 222,4 222,124 190,124" fill="url(#g)"/>
<polygon points="100,4 132,4 222,124 190,124" fill="url(#g)"/>

<!-- D -->
<path fill-rule="evenodd" fill="url(#g)" d="
M 210,4 L 268,4 L 296,30 L 296,98 L 268,124 L 210,124 L 210,96 L 238,96 L 238,32 L 210,32 Z"/>
</g>

<!-- diagonal sheen overlay for crystalline highlight -->
<rect x="0" y="0" width="300" height="130" fill="url(#sheen)" clip-path="url(#clip)"/>
</svg>
